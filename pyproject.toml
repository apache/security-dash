[project]
name = "security-dashboard-frontend"
version = "0.1.0"
license = "Apache-2.0"
# 3.12 is what infra currently provides
requires-python = ">= 3.12"

dependencies = [
  "asfpy",
  "asfquart~=0.1.12",
  "hypercorn",
  "pydantic~=2.11",
]

[tool.pytest.ini_options]
norecursedirs = ["notes"]

[dependency-groups]
dev = ["pytest"]
